name: Build MASTER IBO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extrair projeto
        run: |
          mkdir projeto
          unzip -q master-ibo-v1.2.1.zip -d projeto

      - name: Compilar APK
        working-directory: projeto/master-ibo-android-native
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar APK
        run: |
          cp projeto/master-ibo-android-native/app/build/outputs/apk/debug/app-debug.apk MASTER-IBO.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MASTER-IBO-APK
          path: MASTER-IBO.apk
